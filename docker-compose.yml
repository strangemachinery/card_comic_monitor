# Local TimescaleDB for development. Matches DATABASE_URL in .env.example.
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ccm
      POSTGRES_PASSWORD: ccm
      POSTGRES_DB: ccm
    ports:
      - "5432:5432"
    volumes:
      - ccm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccm -d ccm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ccm_pgdata:
