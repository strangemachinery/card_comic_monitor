[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "card-comic-monitor"
version = "0.1.0"
description = "Self-hosted daily price-snapshot pipeline for trading cards and comics"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ccm = "card_comic_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
