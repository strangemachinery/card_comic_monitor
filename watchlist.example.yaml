# Curated watchlist. Copy to watchlist.yaml and edit.
#
# Each item is one logical collectible with per-source native ids under
# `sources`. The `stub` ids drive the offline demo source (no key needed).
# Wire in real ids alongside them as you activate each vendor.
#
# Finding PriceCharting product ids:
#   Search for your item on pricecharting.com; the id is the number in the URL,
#   e.g. https://www.pricecharting.com/game/pokemon/charizard#... → id is "6910"
#   via the API: GET https://www.pricecharting.com/api/products?q=charizard+base&t=TOKEN
#
# Keeping this list small respects tight API quotas (GoCollect Pro ~100/day).
# See docs/DECISIONS.md for the full quota breakdown.

items:
  - title: "Charizard"
    kind: card
    game: pokemon
    set_name: "Base Set"
    number: "4/102"
    variant: "Unlimited Holo"
    sources:
      stub: "demo-pokemon-charizard-base-unlimited"
      pricecharting: "6910"   # https://www.pricecharting.com/game/pokemon/charizard

  - title: "Monkey D. Luffy (Leader)"
    kind: card
    game: one_piece
    set_name: "Romance Dawn (OP-01)"
    number: "OP01-001"
    sources:
      stub: "demo-onepiece-luffy-op01-001"
      # pricecharting: "<id>"  # look up on pricecharting.com

  - title: "Son Goku"
    kind: card
    game: dragon_ball
    set_name: "Fusion World (FB-01)"
    number: "FB01-001"
    sources:
      stub: "demo-dragonball-goku-fb01-001"
      # pricecharting: "<id>"

  - title: "The Amazing Spider-Man"
    kind: comic
    set_name: "The Amazing Spider-Man (1963)"
    number: "300"
    variant: "First full Venom"
    is_key_issue: true
    sources:
      stub: "demo-comic-asm-300-cgc98"
      # pricecharting: "<id>"   # comics are covered by the same token
      # gocollect: "<id>"       # for CGC-graded FMV + census (Week 2-3)
