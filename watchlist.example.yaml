# Curated watchlist. Copy to watchlist.yaml and edit.
#
# Each item is one logical collectible with per-source native ids under
# `sources`. The `stub` ids drive the offline demo source (no key needed).
# Wire in real ids alongside them as you activate each vendor.
#
# tcgapi (recommended card source): native id = the TCGplayer product id.
#   Find it in the tcgplayer.com product URL (.../product/<ID>/...), or in the
#   free TCGCSV mirror (https://tcgcsv.com). Most card APIs key on this id.
#
# pricecharting (opt-in): native id = pricecharting.com product id (URL number).
#
# Keeping this list small respects tight API quotas (GoCollect Pro ~100/day).
# See docs/DECISIONS.md for the full quota breakdown.

items:
  - title: "Charizard"
    kind: card
    game: pokemon
    set_name: "Base Set"
    number: "4/102"
    variant: "Unlimited Holo"
    sources:
      stub: "demo-pokemon-charizard-base-unlimited"
      tcgapi: "42382"       # tcgplayer.com/product/42382 — Base Set Unlimited

  - title: "Monkey D. Luffy (Leader)"
    kind: card
    game: one_piece
    set_name: "Romance Dawn (OP-01)"
    number: "OP01-003"      # OP01-001 is Zoro; Luffy Leader is OP01-003
    sources:
      stub: "demo-onepiece-luffy-op01-003"
      tcgapi: "454515"      # tcgplayer.com/product/454515

  - title: "Son Goku"
    kind: card
    game: dragon_ball
    set_name: "Awakened Pulse (FB-01)"
    number: "FB01-001"
    sources:
      stub: "demo-dragonball-goku-fb01-001"
      tcgapi: "536821"      # tcgplayer.com/product/536821

  - title: "The Amazing Spider-Man"
    kind: comic
    set_name: "The Amazing Spider-Man (1963)"
    number: "300"
    variant: "First full Venom"
    is_key_issue: true
    sources:
      stub: "demo-comic-asm-300-cgc98"
